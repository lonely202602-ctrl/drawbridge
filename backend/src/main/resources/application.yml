server:
  port: 8180

spring:
  application:
    name: drawbridge
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s   # 优雅停机：给在途提交/轮询最多 30s 收尾
  datasource:
    url: jdbc:mysql://${DRAWBRIDGE_DB_HOST:localhost}:${DRAWBRIDGE_DB_PORT:3306}/${DRAWBRIDGE_DB_NAME:drawbridge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DRAWBRIDGE_DB_USER:root}
    password: ${DRAWBRIDGE_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.drawbridge: info

drawbridge:
  # 上游 API Key 落库加密口令（任意字符串，SHA-256 派生 AES-256 密钥；生产务必改）
  aes-secret: ${DRAWBRIDGE_AES_SECRET:drawbridge-dev-aes-secret-change-me}
  # 管理端登录令牌签名密钥（生产务必改）
  admin-secret: ${DRAWBRIDGE_ADMIN_SECRET:drawbridge-dev-admin-secret-change-me}
